name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # 3.13 is the project floor, not a preference. On older interpreters
          # pip silently resolves archived builds of yt-dlp/numpy/torch and
          # still reports success, which is how a stale extractor once got
          # mistaken for a YouTube quality cap. CI runs the floor so a rebuild
          # there matches a rebuild on a laptop.
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        # The audio/vision extras (PyAudio, whisper, torch) aren't needed for the
        # pure-logic tests; install just what the test suite imports.
        run: |
          python -m pip install --upgrade pip
          pip install \
            "SQLAlchemy>=2.0.0" "fpdf2>=2.7.0" "pillow>=11.0.0" \
            "pandas>=2.2.0" "requests>=2.32.0" "pytest>=8.0.0" \
            "opencv-python-headless>=4.10.0"

      - name: Check dependency freshness
        # Offline check. The vision extras aren't installed here, so this is
        # really asserting the interpreter floor — the thing that quietly
        # freezes everything else when it slips.
        run: python depcheck.py

      - name: Run tests
        run: pytest
