# Kickoff Pulse — pinned dependency lock.
#
# Generated from a known-good virtualenv with `pip freeze`. requirements.txt says
# what the app needs; this says exactly what was verified to work, so a rebuild
# on match day cannot pick up a breaking upstream release.
#
# Install the verified set:
#     pip install -r requirements.lock
#
# Refresh after deliberately upgrading something, and only once the tests pass:
#     .venv/bin/python -m pip freeze | grep -v '^-e' | sort > requirements.lock
#
# Platform note: this was captured on macOS/Apple Silicon, so it includes the
# mlx-whisper path and pyobjc. On other platforms install requirements.txt.
